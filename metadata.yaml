name: astrbot_plugin_bus_alarm
display_name: 公交赶车闹钟
desc: 按自定义时间与日期规则，主动推送候车站最近数辆公交车的到站信息，并附一张标注线路走向与实时车辆位置的地图。覆盖全国 500+ 城市，支持法定节假日与调休补班日，自带 WebUI 插件页面。
short_desc: 公交到站提醒，到点推送最近几辆车还有几站，附带线路地图，全国可用。
